<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Online Diary</title>
</head>
<body>

    <h1>공통 Header</h1>
    <hr>

    <h2>온라인 감정 다이어리</h2>
    <p>오늘의 감정을 기록하는 다이어리 페이지입니다.</p>

    {% for diary in mood_diary_list %}
        <div>
            <h3>오늘의 감정: {{ diary.mood }}</h3>
            <p>{{ diary.content }}</p>
            <p>작성일: {{ diary.created_at }}</p>
        </div>
        <hr>
    {% endfor %}

    <p>공통 Footer</p>

</body>
</html>
